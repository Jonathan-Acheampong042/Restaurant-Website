<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="breadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A221B"/>
      <stop offset="100%" stop-color="#19130F"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49A5B"/>
      <stop offset="50%" stop-color="#B87333"/>
      <stop offset="85%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#4A2508"/>
    </linearGradient>
    <radialGradient id="oilPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9EAA38" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#6F7C20" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4A5410" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#breadBg)" rx="12"/>

  <!-- Wooden Peel / Board -->
  <path d="M 60 210 L 480 140 C 510 135, 540 160, 535 220 C 530 270, 490 290, 460 290 L 60 250 Z" fill="#3D291A" stroke="#22160C" stroke-width="2"/>

  <!-- Rustic Blistered Flatbread Shape -->
  <path d="M 120 220 C 140 150, 240 140, 340 150 C 440 160, 490 210, 470 250 C 440 285, 280 290, 160 275 C 120 265, 110 240, 120 220 Z" fill="url(#crustGrad)" stroke="#3B1C05" stroke-width="2.5"/>

  <!-- Char Blisters from Hearth -->
  <ellipse cx="210" cy="190" rx="16" ry="10" fill="#1C0D03" opacity="0.9"/>
  <ellipse cx="320" cy="180" rx="22" ry="12" fill="#1C0D03" opacity="0.85"/>
  <ellipse cx="400" cy="225" rx="18" ry="11" fill="#1C0D03" opacity="0.9"/>
  <ellipse cx="170" cy="245" rx="14" ry="8" fill="#1C0D03" opacity="0.85"/>
  <ellipse cx="270" cy="235" rx="25" ry="14" fill="#1C0D03" opacity="0.8"/>
  <ellipse cx="360" cy="250" rx="15" ry="9" fill="#1C0D03" opacity="0.9"/>

  <!-- First-Cold-Pressed Olive Oil Pools -->
  <ellipse cx="240" cy="210" rx="35" ry="18" fill="url(#oilPool)"/>
  <ellipse cx="340" cy="215" rx="30" ry="15" fill="url(#oilPool)"/>

  <!-- Wild Oregano & Flaky Sea Salt Flakes -->
  <g fill="#2C401E">
    <circle cx="230" cy="205" r="2.5"/>
    <circle cx="245" cy="215" r="2"/>
    <circle cx="260" cy="208" r="2.5"/>
    <circle cx="330" cy="210" r="2"/>
    <circle cx="350" cy="218" r="2.5"/>
    <circle cx="300" cy="195" r="2"/>
    <circle cx="380" cy="230" r="2.5"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <!-- Sea Salt Pyramids -->
    <rect x="225" y="210" width="3" height="3" transform="rotate(25 225 210)"/>
    <rect x="345" y="205" width="3" height="3" transform="rotate(45 345 205)"/>
    <rect x="280" y="220" width="3" height="3" transform="rotate(15 280 220)"/>
    <rect x="315" y="235" width="2.5" height="2.5" transform="rotate(60 315 235)"/>
  </g>

  <!-- Dish Title Overlay -->
  <rect x="30" y="30" width="270" height="34" rx="6" fill="#19130F" fill-opacity="0.85" stroke="#D49A5B" stroke-width="1"/>
  <text x="45" y="52" font-family="'Cinzel', serif, Georgia" font-size="13" font-weight="600" fill="#FAF8F5" letter-spacing="1">BLISTERED HEARTH FLATBREAD</text>
</svg>

