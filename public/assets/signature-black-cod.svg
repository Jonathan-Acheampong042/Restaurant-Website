<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="codPlateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222B1F"/>
      <stop offset="100%" stop-color="#141A12"/>
    </linearGradient>
    <radialGradient id="plateCeramic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2EDE4"/>
      <stop offset="85%" stop-color="#D9D0C1"/>
      <stop offset="100%" stop-color="#BFB4A0"/>
    </radialGradient>
    <linearGradient id="fishGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2A14"/>
      <stop offset="35%" stop-color="#8C4D21"/>
      <stop offset="70%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#3D200E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#codPlateBg)" rx="12"/>

  <!-- Artisan Ceramic Platter -->
  <ellipse cx="300" cy="200" rx="220" ry="140" fill="url(#plateCeramic)" stroke="#8C8270" stroke-width="3"/>
  <ellipse cx="300" cy="200" rx="190" ry="115" fill="#E8E2D5" opacity="0.6"/>

  <!-- Olive Oil Drizzle Accent -->
  <path d="M 200 240 Q 260 270 340 250 Q 400 230 420 180" stroke="#7A8B42" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <circle cx="210" cy="245" r="3.5" fill="#7A8B42"/>
  <circle cx="410" cy="185" r="4.5" fill="#7A8B42"/>

  <!-- Hearth-Roasted Black Cod Fillet -->
  <path d="M 210 180 C 230 140, 360 135, 410 170 C 420 205, 370 245, 230 230 C 190 220, 195 200, 210 180 Z" fill="url(#fishGlaze)" stroke="#2D1508" stroke-width="2"/>

  <!-- Charred Sear Marks -->
  <g stroke="#1F0E05" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="245" y1="170" x2="270" y2="215"/>
    <line x1="285" y1="160" x2="315" y2="210"/>
    <line x1="330" y1="155" x2="360" y2="205"/>
    <line x1="375" y1="165" x2="395" y2="195"/>
  </g>

  <!-- Charred Meyer Lemon Wheel -->
  <g transform="translate(180, 220)">
    <circle cx="0" cy="0" r="28" fill="#E5A93C" stroke="#A6701C" stroke-width="2"/>
    <circle cx="0" cy="0" r="23" fill="#F4CF65"/>
    <!-- Segments -->
    <g stroke="#C28B23" stroke-width="1.5">
      <line x1="0" y1="-23" x2="0" y2="23"/>
      <line x1="-23" y1="0" x2="23" y2="0"/>
      <line x1="-16" y1="-16" x2="16" y2="16"/>
      <line x1="-16" y1="16" x2="16" y2="-16"/>
    </g>
    <!-- Char mark -->
    <path d="M -18 -10 Q 0 -5 18 -12" stroke="#4A2A0C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Kalamata Olive Tapenade Garnish -->
  <g fill="#211E1D">
    <ellipse cx="370" cy="160" rx="8" ry="5" transform="rotate(-15 370 160)"/>
    <ellipse cx="385" cy="168" rx="7" ry="4" transform="rotate(25 385 168)"/>
    <ellipse cx="360" cy="172" rx="7.5" ry="4.5"/>
  </g>

  <!-- Micro Herb Sprigs -->
  <g stroke="#486B38" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 290 185 Q 310 175 325 180"/>
    <path d="M 300 180 Q 305 170 315 172"/>
  </g>

  <!-- Dish Title Overlay -->
  <rect x="30" y="30" width="260" height="34" rx="6" fill="#141A12" fill-opacity="0.85" stroke="#7A8B42" stroke-width="1"/>
  <text x="45" y="52" font-family="'Cinzel', serif, Georgia" font-size="13" font-weight="600" fill="#FAF8F5" letter-spacing="1">HEARTH-ROASTED BLACK COD</text>
</svg>

