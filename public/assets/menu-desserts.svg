<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dessertBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E1A"/>
      <stop offset="100%" stop-color="#140E0C"/>
    </linearGradient>
    <radialGradient id="dessertPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7F3EB"/>
      <stop offset="85%" stop-color="#E5DC handleC"/>
      <stop offset="100%" stop-color="#BFB4A0"/>
    </radialGradient>
    <linearGradient id="cakeCrumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C265"/>
      <stop offset="50%" stop-color="#D9972E"/>
      <stop offset="100%" stop-color="#996010"/>
    </linearGradient>
    <linearGradient id="chocolateGanache" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1C10"/>
      <stop offset="60%" stop-color="#241008"/>
      <stop offset="100%" stop-color="#140703"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#dessertBg)" rx="12"/>

  <!-- Artisan Ceramic Dessert Plate -->
  <circle cx="300" cy="195" r="145" fill="#F4EFE6" stroke="#9E927F" stroke-width="2.5"/>
  <circle cx="300" cy="195" r="125" fill="#EAE2D3" stroke="#D1C6B4" stroke-width="1"/>

  <!-- Olive Oil Glaze Drizzle -->
  <path d="M 220 180 Q 280 150 350 170 Q 380 230 320 250 Q 250 260 230 210" fill="none" stroke="#7A8B42" stroke-width="3" opacity="0.6"/>

  <!-- Wedge of Olive Oil Citrus Cake -->
  <path d="M 230 220 L 330 145 L 360 210 Z" fill="url(#cakeCrumb)" stroke="#734509" stroke-width="1.5"/>
  <path d="M 230 220 L 330 145 L 330 135 L 230 210 Z" fill="#F7D488" opacity="0.9"/>

  <!-- Smoked Dark Chocolate Ganache Truffle / Sphere -->
  <circle cx="260" cy="170" r="24" fill="url(#chocolateGanache)" stroke="#0D0401" stroke-width="1.5"/>
  <ellipse cx="253" cy="162" rx="7" ry="4" fill="#6E3A24" opacity="0.7"/>

  <!-- Flaky Sea Salt on Ganache -->
  <rect x="256" y="166" width="3" height="3" fill="#FFFFFF" opacity="0.9" transform="rotate(25, 256, 166)"/>
  <rect x="264" y="172" width="2.5" height="2.5" fill="#FFFFFF" opacity="0.9" transform="rotate(10, 264, 172)"/>

  <!-- Candied Blood Orange Peel Curls -->
  <path d="M 320 150 Q 345 130 355 155 Q 360 175 345 185" fill="none" stroke="#C85A32" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 330 160 Q 360 140 370 165" fill="none" stroke="#E5832E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dusting of Pistachio Powder -->
  <g fill="#6B7F39" opacity="0.75">
    <circle cx="210" cy="230" r="1.5"/>
    <circle cx="215" cy="225" r="2"/>
    <circle cx="220" cy="235" r="1.5"/>
    <circle cx="340" cy="225" r="2"/>
    <circle cx="348" cy="220" r="1.5"/>
    <circle cx="355" cy="230" r="2"/>
  </g>

  <!-- Label Watermark -->
  <text x="300" y="325" font-family="'Cinzel', serif, Georgia" font-size="14" fill="#D4A77D" letter-spacing="3" text-anchor="middle" opacity="0.8">
    CONFECTIONS &amp; OLIVE ORCHARD DOLCI
  </text>
</svg>
