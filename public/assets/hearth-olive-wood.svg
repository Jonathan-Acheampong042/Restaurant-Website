<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2218"/>
      <stop offset="50%" stop-color="#2D3A28"/>
      <stop offset="100%" stop-color="#151C13"/>
    </linearGradient>
    <radialGradient id="hearthGlow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#FFA84A" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#C85A32" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#802E15" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2D3A28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D4537"/>
      <stop offset="50%" stop-color="#252C20"/>
      <stop offset="100%" stop-color="#181D15"/>
    </linearGradient>
    <linearGradient id="emberGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E85D26"/>
      <stop offset="50%" stop-color="#FFAE42"/>
      <stop offset="100%" stop-color="#FFEAA7"/>
    </linearGradient>
    <filter id="flameBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Brickwork Texture -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
    <line x1="100" y1="80" x2="700" y2="80"/>
    <line x1="80" y1="120" x2="720" y2="120"/>
    <line x1="60" y1="160" x2="740" y2="160"/>
    <line x1="100" y1="80" x2="100" y2="120"/>
    <line x1="250" y1="80" x2="250" y2="120"/>
    <line x1="400" y1="80" x2="400" y2="120"/>
    <line x1="550" y1="80" x2="550" y2="120"/>
    <line x1="175" y1="120" x2="175" y2="160"/>
    <line x1="325" y1="120" x2="325" y2="160"/>
    <line x1="475" y1="120" x2="475" y2="160"/>
    <line x1="625" y1="120" x2="625" y2="160"/>
  </g>

  <!-- Masonry Hearth Arch -->
  <path d="M 180 520 L 180 320 C 180 180, 620 180, 620 320 L 620 520 Z" fill="url(#archGrad)" stroke="#4A5643" stroke-width="3"/>
  <path d="M 210 520 L 210 330 C 210 215, 590 215, 590 330 L 590 520 Z" fill="#121610"/>

  <!-- Hearth Core Radial Glow -->
  <ellipse cx="400" cy="420" rx="260" ry="180" fill="url(#hearthGlow)" filter="url(#flameBlur)"/>

  <!-- Seasoned Olive Wood Logs -->
  <g fill="#2C1D11" stroke="#170F08" stroke-width="2">
    <!-- Base Log Left -->
    <rect x="250" y="450" width="180" height="42" rx="10" transform="rotate(-8 340 470)"/>
    <!-- Base Log Right -->
    <rect x="370" y="450" width="190" height="40" rx="10" transform="rotate(7 465 470)"/>
    <!-- Cross Log Top -->
    <rect x="290" y="420" width="220" height="38" rx="8" transform="rotate(-2 400 439)"/>
  </g>

  <!-- Glowing Embers & Dynamic Flame Silhouettes -->
  <g fill="url(#emberGrad)" filter="url(#flameBlur)">
    <!-- Central Fire Silhouette -->
    <path d="M 360 450 Q 340 370 380 330 Q 370 370 395 310 Q 420 360 410 390 Q 440 340 435 410 Q 450 380 440 450 Z"/>
    <path d="M 330 460 Q 315 410 345 375 Q 340 410 365 460 Z" opacity="0.85"/>
    <path d="M 430 460 Q 455 390 440 350 Q 460 400 475 460 Z" opacity="0.85"/>
    <path d="M 380 450 Q 400 360 405 320 Q 415 370 425 450 Z" fill="#FFF9E6"/>
  </g>

  <!-- Floating Ash Particles / Embers -->
  <circle cx="340" cy="300" r="3.5" fill="#FFAE42" opacity="0.8"/>
  <circle cx="430" cy="270" r="2.5" fill="#FF7733" opacity="0.9"/>
  <circle cx="380" cy="240" r="3" fill="#FFEAA7" opacity="0.7"/>
  <circle cx="460" cy="290" r="2" fill="#FFAE42" opacity="0.85"/>
  <circle cx="310" cy="260" r="2.5" fill="#FF7733" opacity="0.75"/>
  <circle cx="410" cy="210" r="2" fill="#FFEAA7" opacity="0.6"/>

  <!-- Olive Branch Accents (Foliage & Olives) -->
  <g stroke="#7E9672" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 80 500 Q 140 440 180 340 Q 200 290 190 230"/>
    <path d="M 720 500 Q 660 440 620 340 Q 600 290 610 230"/>
  </g>
  <g fill="#4A5E42">
    <!-- Left Leaves -->
    <ellipse cx="140" cy="420" rx="14" ry="7" transform="rotate(-35 140 420)"/>
    <ellipse cx="165" cy="370" rx="14" ry="7" transform="rotate(-20 165 370)"/>
    <ellipse cx="185" cy="315" rx="13" ry="6" transform="rotate(-40 185 315)"/>
    <ellipse cx="190" cy="260" rx="12" ry="6" transform="rotate(-15 190 260)"/>
    <!-- Right Leaves -->
    <ellipse cx="660" cy="420" rx="14" ry="7" transform="rotate(35 660 420)"/>
    <ellipse cx="635" cy="370" rx="14" ry="7" transform="rotate(20 635 370)"/>
    <ellipse cx="615" cy="315" rx="13" ry="6" transform="rotate(40 615 315)"/>
    <ellipse cx="610" cy="260" rx="12" ry="6" transform="rotate(15 610 260)"/>
  </g>
  <g fill="#273322">
    <!-- Olives -->
    <circle cx="150" cy="435" r="5"/>
    <circle cx="178" cy="385" r="5.5"/>
    <circle cx="650" cy="435" r="5"/>
    <circle cx="622" cy="385" r="5.5"/>
  </g>

  <!-- Editorial Badge Overlay -->
  <rect x="260" y="525" width="280" height="44" rx="22" fill="#151C13" fill-opacity="0.9" stroke="#C85A32" stroke-width="1.5"/>
  <text x="400" y="552" font-family="'Cinzel', serif, Georgia" font-size="14" font-weight="600" fill="#FAF8F5" text-anchor="middle" letter-spacing="2">LIVE OLIVE WOOD HEARTH</text>
</svg>

