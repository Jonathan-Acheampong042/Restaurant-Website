<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1A15"/>
      <stop offset="100%" stop-color="#120F0C"/>
    </linearGradient>
    <radialGradient id="hearthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C85A32" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#8C3817" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#120F0C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribeyeSear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B150A"/>
      <stop offset="40%" stop-color="#592812"/>
      <stop offset="70%" stop-color="#8A3C19"/>
      <stop offset="100%" stop-color="#241005"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#mainBg)" rx="12"/>

  <!-- Hearth Heat Radial Glow -->
  <circle cx="300" cy="200" r="190" fill="url(#hearthGlow)"/>

  <!-- Cast Iron Skillet / Platter -->
  <ellipse cx="300" cy="200" rx="210" ry="135" fill="#242322" stroke="#403D39" stroke-width="3"/>
  <ellipse cx="300" cy="200" rx="185" ry="115" fill="#1C1B1A" stroke="#33312E" stroke-width="1.5"/>

  <!-- Fire-Roasted Bone-In Ribeye Cut -->
  <path d="M 180 180 C 200 130, 320 120, 390 160 C 430 185, 410 240, 320 255 C 240 270, 160 230, 180 180 Z" fill="url(#ribeyeSear)" stroke="#170A04" stroke-width="2"/>

  <!-- Diamond Grill Crosshatch Marks -->
  <g stroke="#0D0401" stroke-width="2.5" opacity="0.9" stroke-linecap="round">
    <line x1="220" y1="160" x2="360" y2="230"/>
    <line x1="250" y1="150" x2="380" y2="210"/>
    <line x1="280" y1="145" x2="390" y2="190"/>

    <line x1="360" y1="160" x2="220" y2="230"/>
    <line x1="380" y1="175" x2="250" y2="245"/>
    <line x1="340" y1="145" x2="210" y2="210"/>
  </g>

  <!-- Flaky Maldon Sea Salt Crystals -->
  <g fill="#FFFFFF" opacity="0.85">
    <rect x="260" y="175" width="4" height="4" transform="rotate(45, 260, 175)"/>
    <rect x="310" y="185" width="5" height="5" transform="rotate(20, 310, 185)"/>
    <rect x="290" y="210" width="3.5" height="3.5" transform="rotate(10, 290, 210)"/>
    <rect x="350" y="195" width="4" height="4" transform="rotate(35, 350, 195)"/>
  </g>

  <!-- Fresh Charred Rosemary Sprig -->
  <g stroke="#3B471D" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 210 220 Q 280 235 340 215"/>
    <!-- Needles -->
    <line x1="240" y1="225" x2="235" y2="215"/>
    <line x1="255" y1="228" x2="250" y2="218"/>
    <line x1="270" y1="230" x2="268" y2="220"/>
    <line x1="285" y1="230" x2="285" y2="218"/>
    <line x1="305" y1="228" x2="308" y2="217"/>
    <line x1="320" y1="223" x2="325" y2="212"/>
  </g>

  <!-- Charred Garlic Bulb Half -->
  <g transform="translate(400, 225)">
    <circle cx="0" cy="0" r="18" fill="#E8D8BA" stroke="#7A5826" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#C49B58" opacity="0.6"/>
    <line x1="-10" y1="-5" x2="10" y2="5" stroke="#381D02" stroke-width="2"/>
    <line x1="-5" y1="-10" x2="5" y2="10" stroke="#381D02" stroke-width="2"/>
  </g>

  <!-- Label Watermark -->
  <text x="300" y="325" font-family="'Cinzel', serif, Georgia" font-size="14" fill="#C8966E" letter-spacing="3" text-anchor="middle" opacity="0.8">
    HEARTH-FIRED PRINCIPAL SELECTIONS
  </text>
</svg>
